name: CI

on:
  push:
    branches: [main]
  pull_request:

# El flujo solo lee el codigo: ningun paso necesita permisos de escritura sobre el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # en main no se cancela nada: cada commit del historial queda con su resultado
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  calidad:
    name: Calidad (tipos, lint, formato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:text
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Dependencias con vulnerabilidades conocidas
        run: npm audit --omit=dev --audit-level=high

  pruebas-unitarias:
    name: Pruebas unitarias e integracion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:cov

  compilacion:
    name: Compilacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest
    needs: compilacion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Navegadores de Playwright en caché
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
        env:
          CI: 'true'
      - name: Subir reporte si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7
