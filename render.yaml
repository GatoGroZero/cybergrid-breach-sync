services:
  - type: web
    name: cybergrid-breach-sync
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/test/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Almacen duradero (Upstash Redis, API REST) para cuentas con correo y progreso de la Aventura.
      # El disco gratis de Render se borra en cada despliegue; los valores se escriben en Render.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
